<body class="bg-background text-text-primary font-body antialiased">
  <div class="min-h-screen flex bg-background">

        </a>
        <a href="#" class="h-[36px] flex items-center gap-md px-md rounded-control text-text-secondary hover:text-text-primary hover:bg-surface-elevated font-label text-label-lg transition-colors duration-interactive ease-interactive">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">settings</span>

            <a href="#" data-design-text-token="label-md" class="font-label text-label-md text-text-secondary hover:text-text-primary transition-colors duration-interactive ease-interactive">My Library</a>
            <span data-design-text-token="label-md" class="font-label text-label-md text-text-secondary">/</span>
            <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Add Book</span>
          </nav>
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-text-primary">Add a New Book</h1>
        </header>

        <!-- Form Card -->
        <form class="bg-surface border border-border rounded-card p-2xl flex flex-col gap-lg">
          <label class="flex flex-col gap-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Title *</span>
            <input type="text" required placeholder="e.g. Designing Data-Intensive Applications" class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary placeholder:text-text-secondary font-body text-body-md focus:outline-none focus:border-border-focus focus:ring-0 transition-colors duration-interactive ease-interactive">
          </label>

          <label class="flex flex-col gap-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Author *</span>
            <input type="text" required placeholder="e.g. Martin Kleppmann" class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary placeholder:text-text-secondary font-body text-body-md focus:outline-none focus:border-border-focus focus:ring-0 transition-colors duration-interactive ease-interactive">
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-lg">
            <label class="flex flex-col gap-xs">
              <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Category *</span>
              <select class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary font-body text-body-md focus:outline-none focus:border-border-focus focus:ring-0">
                <option>Engineering</option>
                <option>Arabic Literature</option>
                <option>Fiction &amp; Sci-Fi</option>
                <option>Self-Development</option>
                <option>Uncategorized</option>
              </select>
            </label>

            <label class="flex flex-col gap-xs">
              <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Reading Status *</span>
              <select class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary font-body text-body-md focus:outline-none focus:border-border-focus focus:ring-0">
                <option>To Read</option>
                <option>Reading</option>
                <option>Completed</option>
              </select>
            </label>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-lg">
            <label class="flex flex-col gap-xs">
              <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Total Pages *</span>
              <input type="number" required min="1" placeholder="e.g. 420" class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary placeholder:text-text-secondary font-body text-body-md tabular-nums focus:outline-none focus:border-border-focus focus:ring-0">
            </label>

            <label class="flex flex-col gap-xs">
              <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Current Page</span>
              <input type="number" min="0" placeholder="0" class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary placeholder:text-text-secondary font-body text-body-md tabular-nums focus:outline-none focus:border-border-focus focus:ring-0">
            </label>
          </div>

          <!-- Cover Image URL + 48x72 Live Preview -->
          <div class="flex items-end gap-lg">
            <label class="flex-1 flex flex-col gap-xs">
              <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Cover Image URL <span class="text-text-secondary font-normal">(Optional)</span></span>
              <input type="url" placeholder="https://..." class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary placeholder:text-text-secondary font-body text-body-md focus:outline-none focus:border-border-focus focus:ring-0">
            </label>
            <div class="w-[48px] h-[72px] rounded-cover border border-border bg-background flex items-center justify-center shrink-0" aria-label="Cover preview">
              <span class="material-symbols-outlined text-[18px] text-text-muted" aria-hidden="true">menu_book</span>
            </div>
          </div>

          <!-- Interactive 1-5 Monochrome Star Selector -->
          <div class="flex flex-col gap-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Rating <span class="text-text-secondary font-normal">(Optional)</span></span>
            <div id="star-selector" class="flex items-center gap-xs" role="radiogroup" aria-label="Book rating">
              <button type="button" data-star="1" aria-label="1 star" class="p-xs rounded-control text-text-secondary hover:text-text-primary transition-colors duration-interactive ease-interactive">
                <span class="material-symbols-outlined text-[20px]">star</span>
              </button>
              <button type="button" data-star="2" aria-label="2 stars" class="p-xs rounded-control text-text-secondary hover:text-text-primary transition-colors duration-interactive ease-interactive">
                <span class="material-symbols-outlined text-[20px]">star</span>
              </button>
              <button type="button" data-star="3" aria-label="3 stars" class="p-xs rounded-control text-text-secondary hover:text-text-primary transition-colors duration-interactive ease-interactive">

              </button>
              <button type="button" data-star="4" aria-label="4 stars" class="p-xs rounded-control text-text-secondary hover:text-text-primary transition-colors duration-interactive ease-interactive">

              </button>
              <button type="button" data-star="5" aria-label="5 stars" class="p-xs rounded-control text-text-secondary hover:text-text-primary transition-colors duration-interactive ease-interactive">
                <span class="material-symbols-outlined text-[20px]">star</span>
              </button>
            </div>
          </div>

          <!-- Description / Personal Notes -->
          <label class="flex flex-col gap-xs">
            <span data-design-text-token="label-md" class="font-label text-label-md text-text-primary">Description / Personal Notes <span class="text-text-secondary font-normal">(Optional)</span></span>
            <textarea rows="4" placeholder="Write a short summary or your reading notes..." class="w-full px-md py-sm rounded-control bg-background border border-border text-text-primary placeholder:text-text-secondary font-body text-body-md focus:outline-none focus:border-border-focus focus:ring-0 resize-y"></textarea>
          </label>

          <!-- Footer -->
          <footer class="flex items-center justify-end gap-sm pt-md border-t border-border">
            <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="inline-flex items-center justify-center px-lg py-sm rounded-control bg-surface border border-border text-text-primary font-label text-label-lg hover:bg-surface-elevated hover:border-border-focus transition-colors duration-interactive ease-interactive">
              <span data-design-text-token="label-lg">Cancel</span>
            </button>
            <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="inline-flex items-center justify-center px-lg py-sm rounded-control bg-primary text-on-primary font-label text-label-lg hover:opacity-90 transition-colors duration-interactive ease-interactive">
              <span data-design-text-token="label-lg">Save Book</span>
            </button>
          </footer>
        </form>
      </div>
    </main>
  </div>
  <script>
    const stars = document.querySelectorAll('#star-selector button');
    stars.forEach((btn) => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.dataset.star, 10);
        stars.forEach((s, i) => {
          const icon = s.querySelector('span');
          if (i < val) {
            s.classList.remove('text-text-secondary');
            s.classList.add('text-text-primary');
            icon.style.fontVariationSettings = "'FILL' 1";
          } else {
            s.classList.add('text-text-secondary');
            s.classList.remove('text-text-primary');
            icon.style.fontVariationSettings = "'FILL' 0";
          }
        });
      });
    });
  </script>
